<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>興嘉國小親子共讀護照</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  
  <style>
    :root {
      --primary-color: #00897b;
      --secondary-color: #004d40;
      --bg-color: #f0f4f8;
    }

    body {
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      background-color: var(--bg-color);
      color: #333;
    }

    /* 頂部橫幅 */
    .header-banner {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      color: white;
      padding: 2.5rem 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
    }

    /* 卡片共用樣式 */
    .custom-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.05);
      border: none;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    /* 表單元件 */
    .form-floating > .form-control {
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      background-color: #fdfdfd;
    }
    .form-floating > .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 0.25rem rgba(0, 137, 123, 0.25);
    }

    /* 照片上傳區 */
    .upload-box {
      border: 2px dashed #ced4da;
      border-radius: 15px;
      padding: 2rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background-color: #fafafa;
    }
    .upload-box:hover {
      border-color: var(--primary-color);
      background-color: #e0f2f1;
    }
    .upload-box i { font-size: 3rem; color: #adb5bd; margin-bottom: 1rem; }
    #previewImage { max-width: 100%; max-height: 250px; border-radius: 10px; display: none; margin-top: 15px; }

    /* 字數標籤 */
    .char-badge { font-size: 0.85rem; padding: 0.5em 1em; border-radius: 50px; font-weight: 600; }
    .bg-error { background-color: #ffcdd2; color: #c62828; }
    .bg-ok { background-color: #c8e6c9; color: #2e7d32; }

    /* 送出按鈕 */
    .btn-submit {
      background: var(--primary-color); border: none; border-radius: 50px; padding: 12px 30px;
      font-size: 1.1rem; font-weight: bold; color: white; transition: all 0.3s;
    }
    .btn-submit:hover:not(:disabled) { background: var(--secondary-color); transform: translateY(-2px); }
    .btn-submit:disabled { background: #ccc; }

    /* 右側數據統計區塊 */
    .stat-box {
      background: linear-gradient(135deg, #ffffff 0%, #f1f8e9 100%);
      border-left: 5px solid var(--primary-color);
      padding: 1.5rem; border-radius: 15px; margin-bottom: 1.5rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }
    .stat-number { font-size: 2.5rem; font-weight: bold; color: var(--primary-color); }

    /* 最新動態列表與縮圖 */
    .recent-post-item {
      padding: 1rem; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;
    }
    .recent-post-item:last-child { border-bottom: none; }
    .post-content { flex: 1; padding-right: 15px; }
    .post-thumbnail {
      width: 80px; height: 80px; object-fit: cover; border-radius: 10px; cursor: pointer;
      transition: transform 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .post-thumbnail:hover { transform: scale(1.05); }
    .thought-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 0.9rem; color: #666; }

  </style>
</head>
<body>

  <!-- 頂部標題區 -->
  <div class="header-banner text-center">
    <div class="container">
      <h1 class="fw-bold"><i class="fas fa-book-reader me-2"></i>興嘉國小親子共讀護照</h1>
      <p class="mb-0 mt-2 opacity-75" id="quoteText">「閱讀，是我們飛向世界最美的翅膀。」</p>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <!-- 左側：打卡表單 -->
      <div class="col-lg-7">
        <div class="custom-card">
          <h4 class="mb-4 text-secondary border-bottom pb-2"><i class="fas fa-edit me-2"></i>我要打卡</h4>
          <form id="readingForm" onsubmit="handleFormSubmit(event)">
            
            <div class="row g-2 mb-3">
              <div class="col-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="className" required placeholder="班級">
                  <label>班級 (例如: 301)</label>
                </div>
              </div>
              <div class="col-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="studentName" required placeholder="姓名">
                  <label>學生姓名</label>
                </div>
              </div>
            </div>

            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="bookTitle" required placeholder="書名">
              <label>共讀書名</label>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="bookAuthor" required placeholder="作者">
                  <label>作者</label>
                </div>
              </div>
              <div class="col-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="bookPublisher" required placeholder="出版社">
                  <label>出版社</label>
                </div>
              </div>
            </div>

            <div class="form-floating mb-2">
              <textarea class="form-control" id="thoughtsInput" style="height: 150px" required oninput="checkLength()" placeholder="心得"></textarea>
              <label>讀後心得感想 (至少 30 字)</label>
            </div>
            
            <div class="text-end mb-4">
              <span id="charCount" class="char-badge bg-error">0 / 30 字</span>
            </div>

            <div class="mb-4">
              <label class="form-label text-secondary fw-bold mb-2"><i class="fas fa-camera me-2"></i>上傳共讀照片</label>
              <div class="upload-box" onclick="document.getElementById('photoFile').click()">
                <i class="fas fa-cloud-upload-alt"></i>
                <h6 class="text-secondary">點擊選擇照片</h6>
                <input type="file" id="photoFile" accept="image/*" class="d-none" onchange="previewFile()" required>
                <img id="previewImage" src="" alt="照片預覽">
              </div>
            </div>

            <button type="submit" class="btn btn-submit w-100" id="submitBtn" disabled>
              <i class="fas fa-paper-plane me-2"></i> 送出閱讀紀錄
            </button>

          </form>
        </div>
      </div>

      <!-- 右側：統計數據與最新動態 -->
      <div class="col-lg-5">
        
        <!-- 統計數字 -->
        <div class="stat-box d-flex justify-content-between align-items-center">
          <div>
            <div class="text-muted mb-1"><i class="fas fa-book me-1"></i> 全校累積共讀</div>
            <div class="stat-number" id="totalCountDisplay">0 <span class="fs-5 text-muted fw-normal">本</span></div>
          </div>
          <div class="text-end">
            <div class="text-muted mb-1"><i class="fas fa-home me-1"></i> 參與家庭</div>
            <div class="stat-number" id="familyCountDisplay">0 <span class="fs-5 text-muted fw-normal">戶</span></div>
          </div>
        </div>

        <!-- 圖表 -->
        <div class="custom-card py-3 px-3 mb-4">
          <h6 class="text-center text-secondary mb-3">各年級參與狀況</h6>
          <canvas id="gradeChart" height="150"></canvas>
        </div>

        <!-- 最新動態 -->
        <div class="custom-card p-0 overflow-hidden">
          <div class="bg-light p-3 border-bottom text-center fw-bold text-secondary">
            <i class="fas fa-bullhorn me-2"></i>最新打卡動態
          </div>
          <div id="recentPostsContainer" style="max-height: 400px; overflow-y: auto;">
            <div class="p-4 text-center text-muted">載入中...</div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    // ==========================================
    // 請在這裡填入您的 Google Apps Script 網址
    // ==========================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoV4qkb2MQOCR24v7iLyR_pRBJVFd3Vi5hpU27Vdk9MCIUTCi8Pcr7PVUCrm6iWKbH/exec"; 
    
    // 初始化載入
    window.onload = function() {
      if(SCRIPT_URL !== "YOUR_GAS_WEB_APP_URL") {
        fetchPublicData();
        fetchQuote();
      } else {
        document.getElementById('recentPostsContainer').innerHTML = '<div class="p-4 text-center text-muted">請先設定 SCRIPT_URL 才能載入資料喔！</div>';
      }
    };

    // 檢查心得字數
    function checkLength() {
      const text = document.getElementById('thoughtsInput').value;
      const len = text.replace(/\s/g, '').length;
      const badge = document.getElementById('charCount');
      const btn = document.getElementById('submitBtn');
      
      if (len >= 30) { 
        badge.innerHTML = `<i class="fas fa-check"></i> ${len} / 30`; 
        badge.className = 'char-badge bg-ok'; 
        btn.disabled = false; 
      } else { 
        badge.innerHTML = `${len} / 30 (尚缺 ${30 - len})`; 
        badge.className = 'char-badge bg-error'; 
        btn.disabled = true; 
      }
    }

    // 照片預覽
    function previewFile() {
      const file = document.getElementById('photoFile').files[0];
      const preview = document.getElementById('previewImage');
      const reader = new FileReader();

      reader.addEventListener("load", function () {
        preview.src = reader.result;
        preview.style.display = 'inline-block';
      }, false);

      if (file) {
        reader.readAsDataURL(file);
      }
    }

    // 將 Google Drive 連結轉換為可顯示的圖片縮圖連結
    function getDisplayImageUrl(url) {
      if (!url) return '';
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://drive.google.com/uc?id=${match[1]}`;
      }
      return url;
    }

    // 取得公開數據與動態
    function fetchPublicData() {
      fetch(`${SCRIPT_URL}?action=getPublicData`)
        .then(response => response.json())
        .then(data => {
          // 更新統計數字
          document.getElementById('totalCountDisplay').innerHTML = `${data.totalCount} <span class="fs-5 text-muted fw-normal">本</span>`;
          document.getElementById('familyCountDisplay').innerHTML = `${data.familyCount} <span class="fs-5 text-muted fw-normal">戶</span>`;
          
          // 更新圖表
          updateChart(data.gradeStats);
          
          // 更新最新動態列表 (包含照片縮圖)
          const container = document.getElementById('recentPostsContainer');
          container.innerHTML = '';
          
          if(data.recentPosts && data.recentPosts.length > 0) {
            data.recentPosts.forEach(post => {
              const imgUrl = getDisplayImageUrl(post.imageUrl);
              // 如果有圖片，則渲染右側縮圖區塊
              const imgHtml = imgUrl ? `<img src="${imgUrl}" class="post-thumbnail ms-2" alt="共讀照片" onclick="window.open('${post.imageUrl}', '_blank')">` : '';
              
              const html = `
                <div class="recent-post-item">
                  <div class="post-content">
                    <div class="small text-muted mb-1"><i class="far fa-clock"></i> ${post.time} · ${post.cls} ${post.name}</div>
                    <div class="fw-bold text-primary mb-1">《${post.book}》</div>
                    <div class="thought-text">${post.thoughts}</div>
                  </div>
                  ${imgHtml}
                </div>
              `;
              container.innerHTML += html;
            });
          } else {
            container.innerHTML = '<div class="p-4 text-center text-muted">目前還沒有紀錄，搶先成為第一位打卡的人吧！</div>';
          }
        })
        .catch(err => console.error("獲取資料失敗:", err));
    }

    // 取得隨機金句
    function fetchQuote() {
      fetch(`${SCRIPT_URL}?action=getRandomQuote`)
        .then(res => res.json())
        .then(data => {
          if(data.quote) document.getElementById('quoteText').innerText = data.quote;
        }).catch(err => console.error(err));
    }

    // 更新圖表函數
    let myChart = null;
    function updateChart(stats) {
      const ctx = document.getElementById('gradeChart').getContext('2d');
      const labels = Object.keys(stats);
      const data = Object.values(stats);

      if(myChart) myChart.destroy();
      
      myChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: '共讀本數',
            data: data,
            backgroundColor: '#80cbc4',
            borderColor: '#00897b',
            borderWidth: 1,
            borderRadius: 5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
        }
      });
    }

    // 表單送出處理
    function handleFormSubmit(e) {
      e.preventDefault();
      
      if(SCRIPT_URL === "YOUR_GAS_WEB_APP_URL") {
         Swal.fire('設定錯誤', '請先在程式碼中填入您的 SCRIPT_URL', 'error');
         return;
      }

      const fileInput = document.getElementById('photoFile');
      const file = fileInput.files[0];

      Swal.fire({
        title: '上傳中...',
        html: '正在傳送照片與資料，請稍候<br><span style="font-size: 0.8rem; color:#888;">(照片越大可能需要等久一點喔)</span>',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      const reader = new FileReader();
      reader.onload = function(e_read) {
        const base64Data = e_read.target.result.split(',')[1];
        
        const payload = {
          action: 'processForm',
          data: {
            className: document.getElementById('className').value,
            studentName: document.getElementById('studentName').value,
            bookTitle: document.getElementById('bookTitle').value,
            bookAuthor: document.getElementById('bookAuthor').value,
            bookPublisher: document.getElementById('bookPublisher').value,
            thoughts: document.getElementById('thoughtsInput').value,
            imageName: file.name,
            imageMime: file.type,
            imageData: base64Data
          }
        };

        fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(result => {
          if (result.success) {
            Swal.fire('成功！', '閱讀紀錄與照片已成功送出！', 'success').then(() => {
              document.getElementById('readingForm').reset();
              document.getElementById('previewImage').style.display = 'none';
              checkLength();
              fetchPublicData(); // 重新載入右側數據
            });
          } else {
            Swal.fire('錯誤', result.message || '上傳失敗', 'error');
          }
        })
        .catch(error => {
          Swal.fire('錯誤', '網路連線異常，請稍後再試', 'error');
          console.error(error);
        });
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
